<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Admin Cesta de Presentes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .card h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 4px; }
    .card p  { font-size: 14px; color: #888; margin-bottom: 28px; }

    label { font-size: 13px; font-weight: 500; color: #444; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; font-family: inherit;
      margin-bottom: 16px; outline: none;
      transition: border .2s;
    }
    input:focus { border-color: #c0392b; }

    .btn {
      width: 100%; padding: 12px;
      background: #c0392b; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background .2s;
    }
    .btn:hover { background: #a93226; }

    .erro {
      background: #f8d7da; color: #842029;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎁 Painel Admin</h1>
    <p>Acesso restrito — faça login para continuar</p>

    {% if erro %}
    <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="POST">
      <label>E-mail</label>
      <input type="email" name="email" required autofocus placeholder="seu@email.com">

      <label>Senha</label>
      <input type="password" name="senha" required placeholder="••••••••">

      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</body>
</html>
